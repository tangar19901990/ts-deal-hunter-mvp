<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TS Deal Hunter AI</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <h1>TS Deal Hunter <span class="accent">AI</span></h1>
  </header>

  <main class="container">

    <form id="search-form" class="search-form">
      <input
        type="text"
        id="query"
        placeholder="RTX 4090, iPhone 16 Pro, PS5..."
        autocomplete="off"
        required
      />
      <button type="submit">Знайти</button>
    </form>

    <section class="filters" id="filters">
      <details>
        <summary>Фільтри та сортування</summary>
        <div class="filters-grid">
          <label>
            Мін. ціна
            <input type="number" id="filter-min-price" min="0" placeholder="0" />
          </label>
          <label>
            Макс. ціна
            <input type="number" id="filter-max-price" min="0" placeholder="∞" />
          </label>
          <label>
            Маркетплейс
            <select id="filter-marketplace">
              <option value="">Всі</option>
              <option value="ebay">eBay</option>
              <option value="olx">OLX</option>
              <option value="prom">Prom.ua</option>
              <option value="rozetka">Rozetka</option>
            </select>
          </label>
          <label>
            Стан
            <select id="filter-condition">
              <option value="">Будь-який</option>
              <option value="new">Новий</option>
              <option value="used">Вживаний</option>
            </select>
          </label>
          <label>
            Сортування
            <select id="sort-by">
              <option value="price_asc">Спочатку дешевші</option>
              <option value="price_desc">Спочатку дорожчі</option>
              <option value="newest">Спочатку нові</option>
              <option value="oldest">Спочатку старі</option>
            </select>
          </label>
        </div>
      </details>
    </section>

    <section class="import-section">
      <details>
        <summary>➕ Додати товар з OLX/Prom за посиланням</summary>
        <form id="import-form" class="import-form">
          <input
            type="url"
            id="import-url"
            placeholder="https://www.olx.ua/d/uk/obyavlenie/..."
            required
          />
          <button type="submit">Додати</button>
        </form>
        <p id="import-status" class="status"></p>
      </details>
    </section>

    <p id="status" class="status"></p>

    <section id="results" class="results-grid"></section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
