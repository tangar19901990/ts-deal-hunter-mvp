services:
  - type: web
    name: ts-deal-hunter-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ts-deal-hunter-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: ts-deal-hunter-db
    plan: free
